name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # docs-only PR の判定。`code` は「docs/ ・ .md ・ LICENSE 以外の変更が
      # 一つでもあれば true」。push:main では実行せず、常にフルCIを回す。
      - name: パス変更の判定
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - '**/*'
              - '!docs/**'
              - '!**/*.md'
              - '!LICENSE'

      # docs-only の場合はここで早期成功。必須ステータスチェック `check` は
      # そのまま緑になるため Branch protection の設定は変更不要。
      - name: docs-only の場合はスキップ
        if: github.event_name == 'pull_request' && steps.filter.outputs.code != 'true'
        run: |
          echo "::notice::docs-only PR — skipping lint/typecheck/test/build"
          echo "SKIP=1" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        if: env.SKIP != '1'
        # バージョンはpackage.jsonのpackageManagerを参照

      - uses: actions/setup-node@v4
        if: env.SKIP != '1'
        with:
          node-version: 22
          cache: pnpm

      # .ps1 は Windows PowerShell 5.1 が日本語を正しく読めるよう BOM 付き UTF-8 で置く(#183)。
      # BOM の落ちた .ps1 が入ると 5.1 で文字化けするが、他の環境では気づけないのでここで弾く
      - name: .ps1 の BOM 確認
        if: env.SKIP != '1'
        run: |
          missing=0
          while IFS= read -r -d '' f; do
            if [ "$(head -c3 "$f" | od -An -tx1 | tr -d ' \n')" != "efbbbf" ]; then
              echo "::error file=$f::UTF-8 の BOM がありません(Windows PowerShell 5.1 で日本語が文字化けします)"
              missing=1
            fi
          done < <(git ls-files -z -- '*.ps1')
          exit "$missing"

      - name: 依存関係のインストール
        if: env.SKIP != '1'
        run: pnpm install --frozen-lockfile

      # install 以降は互いに独立なので `parallel:` で同時実行し、
      # 全体時間を最長ステップ(現状はテスト)に律速させる。
      # `parallel:` は単独キーのstepとして書く必要があるため、
      # docs-only スキップ条件は各サブステップの `if:` で持たせる。
      - parallel:
          - name: Lint
            if: env.SKIP != '1'
            run: pnpm lint
          - name: 型チェック
            if: env.SKIP != '1'
            run: pnpm typecheck
          - name: テスト
            if: env.SKIP != '1'
            run: pnpm test
          - name: クライアントビルド
            if: env.SKIP != '1'
            run: pnpm --filter @tsumiwiki/client build
